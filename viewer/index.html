<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dvt-01 nano cell — FR3 arm viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; font-family: ui-sans-serif, system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 268px; max-height: calc(100% - 24px);
    overflow-y: auto; background: rgba(16,20,24,.88); border: 1px solid #2a3340;
    border-radius: 10px; padding: 12px 14px; color: #cdd6e0; font-size: 12.5px;
    backdrop-filter: blur(6px);
  }
  #panel h1 { font-size: 13px; margin: 0 0 2px; color: #fff; font-weight: 600; }
  #panel .sub { color: #7d8a99; margin-bottom: 10px; }
  .joint { display: grid; grid-template-columns: 24px 1fr 52px; gap: 8px; align-items: center; margin: 5px 0; }
  .joint label { color: #9fb0c0; }
  .joint output { text-align: right; font-variant-numeric: tabular-nums; color: #e8eef4; }
  input[type=range] { width: 100%; accent-color: #4da3ff; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  button, select {
    background: #1b2430; color: #cdd6e0; border: 1px solid #2f3b4a; border-radius: 6px;
    padding: 4px 9px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #243140; }
  .checks label { display: flex; gap: 7px; align-items: center; margin: 3px 0; color: #9fb0c0; cursor: pointer; }
  .sect { border-top: 1px solid #263040; margin-top: 10px; padding-top: 8px; }
  .sect b { color: #c6d2de; font-weight: 600; font-size: 12px; }
  .segrow { display: flex; gap: 8px; align-items: center; margin: 4px 0; color: #9fb0c0; }
  .segrow button { padding: 1px 8px; }
  #runControls { display: flex; gap: 6px; margin-top: 6px; }
  #taskline {
    margin-top: 6px; padding: 5px 8px; background: #0c0f13; border-radius: 6px;
    font-family: ui-monospace, monospace; font-size: 11px; color: #8fa3b8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 15px;
  }
  #tip {
    position: fixed; pointer-events: none; background: #0c0f13; color: #e8eef4;
    border: 1px solid #334155; border-radius: 6px; padding: 3px 8px; font-size: 12px;
    display: none; z-index: 10; max-width: 320px;
  }
  #status { position: fixed; right: 14px; bottom: 10px; color: #64748b; font-size: 11.5px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1 id="cellName">dvt-01 nano cell</h1>
  <div class="sub">Fairino FR3 · drag to orbit · live reload</div>
  <div id="joints"></div>
  <div class="row">
    <button id="poseDemo">Dock pose</button>
    <button id="poseUp">Straight up</button>
  </div>
  <div class="sect">
    <b>Task</b>
    <div class="row" style="margin-top:6px">
      <select id="taskSel" style="flex:1"></select>
      <select id="speedSel" title="playback speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </div>
    <div id="segments"></div>
    <div id="runControls">
      <button id="btnPause">Pause</button>
      <button id="btnStep" title="run one command, then pause">Step</button>
      <button id="btnStop">Stop</button>
    </div>
    <div id="taskline">idle</div>
  </div>
  <div class="sect checks" id="toggles"><b>Show</b></div>
  <div class="sect">
    <b>Tool on flange</b><br>
    <select id="toolSel" style="width:100%;margin-top:5px"></select>
  </div>
</div>
<div id="tip"></div>
<div id="status">loading…</div>
<script type="module" src="./app.js"></script>
</body>
</html>
