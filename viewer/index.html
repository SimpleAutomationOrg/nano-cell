<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nano cell</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; font-family: ui-sans-serif, system-ui, sans-serif; }
  :root { --dock: 250px; --rail: 64px; --chat: 430px; --side: 290px; }
  body.chat-closed { --chat: var(--rail); }
  /* three columns: the chat, full height; in the middle the simulation with
     the steps dock below it; the cell panel, full height */
  #app { position: fixed; top: 0; left: var(--chat); right: var(--side); bottom: var(--dock); }
  #dock {
    position: fixed; left: var(--chat); right: var(--side); bottom: 0; height: var(--dock); box-sizing: border-box;
    display: flex; justify-content: center; padding: 10px 14px; background: #0d1115; border-top: 1px solid #2a3340;
    color: #cdd6e0; font-size: 12.5px;
  }
  /* everything that drives the loop sits in the middle, under the simulation */
  #dockMid { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #dockRun { display: flex; gap: 6px; align-items: center; flex: none; }
  #btnLoop { background: #1f4f8a; border-color: #2f6cb5; color: #fff; font-weight: 600; }
  #btnLoop:hover { background: #2a62a8; }
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--side); box-sizing: border-box;
    overflow-y: auto; background: #0d1115; border-left: 1px solid #2a3340;
    padding: 12px 14px; color: #cdd6e0; font-size: 12.5px;
  }
  #panel h1 { font-size: 13px; margin: 0 0 2px; color: #fff; font-weight: 600; }
  #appRow { display: flex; gap: 6px; margin: 6px 0 6px; }
  #appFile { display: flex; gap: 6px; margin: 0 0 8px; }
  #appFile button { flex: 1; }
  #appRow select { flex: 1; min-width: 0; }
  #panel .sub { color: #7d8a99; margin-bottom: 10px; }
  .joint { display: grid; grid-template-columns: 24px 1fr 52px; gap: 8px; align-items: center; margin: 5px 0; }
  .joint label { color: #9fb0c0; }
  .joint output { text-align: right; font-variant-numeric: tabular-nums; color: #e8eef4; }
  input[type=range] { width: 100%; accent-color: #4da3ff; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  button, select {
    background: #1b2430; color: #cdd6e0; border: 1px solid #2f3b4a; border-radius: 6px;
    padding: 4px 9px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #243140; }
  .checks label { display: flex; gap: 7px; align-items: center; margin: 3px 0; color: #9fb0c0; cursor: pointer; }
  .sect { border-top: 1px solid #263040; margin-top: 10px; padding-top: 8px; }
  .sect b { color: #c6d2de; font-weight: 600; font-size: 12px; }
  #stepline {
    flex: 1; min-width: 0; padding: 5px 8px; background: #0c0f13; border-radius: 6px;
    font-family: ui-monospace, monospace; font-size: 11px; color: #8fa3b8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 15px;
  }
  /* the step list (steps-panel.js) */
  #steps { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  #steps.disabled { opacity: .45; pointer-events: none; }
  .steps-sec { border: 1px solid #263040; border-radius: 7px; padding: 4px; }
  .steps-free { border-style: dashed; }
  .steps-head { color: #7d8a99; font-size: 11px; padding: 2px 4px 4px; }
  .steps-empty { color: #55606d; font-size: 11px; padding: 6px 4px; font-style: italic; }
  .step-row {
    display: grid; grid-template-columns: 12px 14px 1fr 12px auto; gap: 5px; align-items: center;
    padding: 3px 4px; border-radius: 5px; cursor: pointer; border: 1px solid transparent;
  }
  .step-row:hover { background: #1b2430; }
  .step-row.sel { background: #1c2c40; border-color: #35557a; }
  .step-row.dragging { opacity: .35; }
  .step-row .grip { color: #55606d; cursor: grab; font-size: 11px; }
  .step-row .num { color: #7d8a99; font-variant-numeric: tabular-nums; text-align: right; font-size: 11px; }
  .step-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step-row .mark { font-size: 11px; text-align: center; }
  .step-row.st-running .mark { color: #4da3ff; }
  .step-row.st-done .mark { color: #7fd0a0; }
  .step-row.st-failed .mark { color: #ff7b72; }
  .step-row.st-stopped .mark { color: #d0a060; }
  .step-row button { padding: 0 6px; font-size: 10px; line-height: 16px; }
  .steps-drop { height: 2px; background: #4da3ff; border-radius: 1px; margin: 1px 4px; pointer-events: none; }
  /* dialogs drawn in the page (dialogs.js) */
  .dlg-veil { position: fixed; inset: 0; z-index: 50; background: rgba(5, 8, 11, .6); display: grid; place-items: center; }
  .dlg { width: min(420px, calc(100vw - 40px)); background: #151b22; border: 1px solid #2f3b4a; border-radius: 12px;
    padding: 16px; color: #cdd6e0; font-size: 13px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5); }
  .dlg-text { white-space: pre-wrap; line-height: 1.45; color: #e8eef4; }
  .dlg input { width: 100%; box-sizing: border-box; margin-top: 10px; background: #0c0f13; color: #e8eef4;
    border: 1px solid #2f3b4a; border-radius: 6px; padding: 7px 9px; font: inherit; }
  .dlg input:focus { outline: 1px solid #4da3ff; }
  .dlg-row { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .dlg button.primary { background: #1f4f8a; border-color: #2f6cb5; color: #fff; font-weight: 600; }
  #tip {
    position: fixed; pointer-events: none; background: #0c0f13; color: #e8eef4;
    border: 1px solid #334155; border-radius: 6px; padding: 3px 8px; font-size: 12px;
    display: none; z-index: 10; max-width: 320px;
  }
  #status { position: fixed; right: calc(var(--side) + 14px); bottom: calc(var(--dock) + 10px); color: #64748b; font-size: 11.5px; }
  /* chat with the agents (chat.js): a narrow bar of profiles, then the conversation */
  #chat {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--chat); box-sizing: border-box;
    display: flex; background: #0d1115; border-right: 1px solid #2a3340;
    color: #cdd6e0; font-size: 12.5px;
  }
  #chatRail {
    flex: none; width: var(--rail); box-sizing: border-box; padding: 10px 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: #0a0d10; border-right: 1px solid #1c232c;
  }
  .agent {
    position: relative; width: calc(var(--rail) - 8px); padding: 6px 0 4px; border: 0; border-radius: 8px;
    background: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .agent:hover { background: #151b22; }
  .agent.sel { background: #18212b; }
  .agent.sel::before { content: ''; position: absolute; left: -4px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--c); }
  .agent .face {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 13px; color: #0d1115; background: var(--c); opacity: .55;
  }
  .agent.sel .face, .agent:hover .face { opacity: 1; }
  .agent .lbl { font-size: 9.5px; line-height: 1.15; color: #7d8a99; max-width: 100%; text-align: center; overflow-wrap: anywhere; }
  .agent.sel .lbl { color: #e8eef4; }
  /* an answer the user has not looked at yet */
  .agent .badge { display: none; position: absolute; top: 1px; right: 7px; min-width: 15px; height: 15px;
    padding: 0 3px; border-radius: 9px; background: #ff5f57; color: #fff; font-size: 9.5px; font-weight: 700; line-height: 15px;
    text-align: center; box-shadow: 0 0 0 2px #0a0d10; box-sizing: border-box; }
  .agent.unread .badge { display: block; }
  .agent.unread .lbl { color: #e8eef4; font-weight: 600; }
  #chatMain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* an agent at work: a turning ring on its profile, moving dots under its conversation */
  .agent.busy .face { opacity: 1; box-shadow: 0 0 0 2px #0a0d10; }
  .agent.busy .face::after {
    content: ''; position: absolute; top: 3px; left: 50%; width: 40px; height: 40px; margin-left: -20px; box-sizing: border-box;
    border-radius: 50%; border: 2px solid transparent; border-top-color: var(--c); border-right-color: var(--c);
    animation: agentspin 0.9s linear infinite;
  }
  @keyframes agentspin { to { transform: rotate(360deg); } }
  #chatWork { display: flex; align-items: center; gap: 8px; padding: 6px 12px; color: #9fb0c0; font-size: 11.5px;
    border-top: 1px solid #1c232c; background: #0f141a; white-space: nowrap; overflow: hidden; }
  #chatWork[hidden] { display: none; }
  #chatWorkText { overflow: hidden; text-overflow: ellipsis; }
  #chatWork .dots { display: inline-flex; gap: 3px; flex: none; }
  #chatWork .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c, #4da3ff); animation: workdot 1.1s infinite ease-in-out; }
  #chatWork .dots i:nth-child(2) { animation-delay: .18s; }
  #chatWork .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes workdot { 0%, 70%, 100% { opacity: .25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }
  #chat.working #chatBox { border-color: #35557a; }
  #chat.closed #chatMain { display: none; }
  #chat header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; cursor: pointer; user-select: none; }
  #chat header .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #chat header b { color: #fff; font-weight: 600; font-size: 13px; }
  #chat header b::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c, #3b4756); margin-right: 6px; vertical-align: middle; }
  #chatRole { color: #7d8a99; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes chatpulse { from { opacity: .35; } to { opacity: 1; } }
  #chatBody { flex: 1; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid #263040; }
  #chatLog { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  #chatLog .msg { line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  #chatLog .user { align-self: flex-end; max-width: 88%; background: #1f3a5c; color: #e8eef4; padding: 6px 9px; border-radius: 9px; }
  #chatLog .tool { color: #6f7f90; font-family: ui-monospace, monospace; font-size: 11px; }
  #chatLog .error { color: #ff8f8f; }
  #chatLog .hint { color: #7d8a99; }
  #chatLog code { font-family: ui-monospace, monospace; font-size: 11.5px; background: #0c0f13; border-radius: 4px; padding: 1px 4px; }
  #chatLog pre { margin: 4px 0; padding: 7px 9px; background: #0c0f13; border-radius: 6px; overflow-x: auto; white-space: pre; }
  #chatLog pre code { padding: 0; background: none; }
  #chat form { padding: 10px; border-top: 1px solid #263040; }
  /* the message box: attached files, the text, then Attach and Send — one frame */
  #chatBox { background: #0c0f13; border: 1px solid #2f3b4a; border-radius: 10px; padding: 8px; }
  #chatBox:focus-within { border-color: #4da3ff; }
  #chat form .line { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  #chat form .tip { flex: 1; min-width: 0; color: #55606d; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chatAttach { flex: none; }
  #chatSend { flex: none; background: #1f4f8a; border-color: #2f6cb5; color: #fff; font-weight: 600; }
  #chatSend:hover { background: #2a62a8; }
  /* work handed to a colleague, and tasks that came from one */
  .handoff { margin-top: 8px; border: 1px solid #2a3340; border-left: 3px solid var(--c, #4da3ff); border-radius: 7px;
    padding: 6px 9px; background: #10161d; cursor: pointer; white-space: normal; }
  .handoff:hover { background: #151d26; }
  .handoff .to { color: #e8eef4; font-weight: 600; }
  .handoff .task { color: #9fb0c0; font-size: 11.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #chatLog .note { color: #8fb4dd; font-size: 11.5px; }
  #chatLog .note.link { cursor: pointer; }
  #chatLog .note.link:hover { text-decoration: underline; }
  #chatLog .user.handed { background: #2a2440; }
  #chatLog .user .from { color: #b9a6ff; font-size: 10.5px; font-weight: 600; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
  /* an agent's questions: a card per question, its options as buttons */
  .ask { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; white-space: normal; }
  .ask-q { border: 1px solid #2a3340; border-radius: 9px; padding: 8px; background: #10161d; }
  .ask-title { color: #e8eef4; font-weight: 600; margin-bottom: 6px; }
  .ask-opts { display: flex; flex-direction: column; gap: 5px; }
  .ask-opt { text-align: left; padding: 6px 9px; border-radius: 7px; display: flex; flex-direction: column; gap: 1px; }
  .ask-opt .l { color: #e8eef4; }
  .ask-opt .d { color: #7d8a99; font-size: 11px; }
  .ask-opt .d:empty { display: none; }
  .ask-opt.rec { border-color: #35557a; }
  .ask-opt.rec .l { color: #9cc8ff; }
  .ask-opt.on { background: #1f4f8a; border-color: #4da3ff; }
  .ask-opt.on .l, .ask-opt.on .d { color: #fff; }
  .ask-other { width: 100%; box-sizing: border-box; margin-top: 6px; background: #0c0f13; color: #e8eef4;
    border: 1px solid #2f3b4a; border-radius: 6px; padding: 5px 8px; font: inherit; }
  .ask-other:focus { outline: 1px solid #4da3ff; }
  .ask-send { align-self: flex-end; background: #1f4f8a; border-color: #2f6cb5; color: #fff; font-weight: 600; }
  .ask-send:disabled { opacity: .45; cursor: default; }
  .ask.settled { opacity: .6; }
  .ask.settled .ask-send, .ask.settled .ask-other { display: none; }
  .ask.settled button { cursor: default; }
  /* files waiting to be sent, and files in a sent message */
  #chatFiles { display: flex; flex-wrap: wrap; gap: 6px; }
  #chatFiles:not(:empty) { margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 4px 3px 6px;
    background: #151b22; border: 1px solid #2f3b4a; border-radius: 7px; font-size: 11.5px; }
  .chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  .chip button { padding: 0 5px; border: 0; background: none; color: #7d8a99; font-size: 14px; }
  .chip button:hover { color: #fff; background: none; }
  #chatLog .sent-file { display: block; margin-top: 5px; color: #b9d4f5; text-decoration: none; font-size: 11.5px; }
  #chatLog .sent-file img { display: block; max-width: 100%; max-height: 180px; border-radius: 6px; }
  #chatMain.dropping { outline: 2px dashed #4da3ff; outline-offset: -6px; background: #0f1721; }
  #chat textarea {
    display: block; width: 100%; box-sizing: border-box; resize: none; height: 62px; background: none; color: #e8eef4;
    border: 0; padding: 2px 2px; font: inherit; outline: none;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1 id="cellName">nano cell</h1>
  <div id="appRow">
    <select id="appSel" title="the applications in applications/ — pick one to open it"></select>
    <button id="appNew" title="create a new, empty application on this robot and open it">New</button>
  </div>
  <div id="appFile">
    <button id="appExport" title="save this application as one .microfactory file, to keep or to send to someone">Export</button>
    <button id="appImport" title="open a .microfactory file: it is unpacked into applications/ and opened">Import</button>
    <input type="file" id="appPick" accept=".microfactory" hidden>
  </div>
  <div class="sub">Fairino FR3 · drag to orbit · WASD to fly · live reload</div>
  <div id="joints"></div>
  <div class="row">
    <button id="poseDemo">Dock pose</button>
    <button id="poseUp">Straight up</button>
  </div>
  <div class="sect checks" id="toggles"><b>Show</b></div>
  <div class="sect">
    <b>Tool on flange</b><br>
    <select id="toolSel" style="width:100%;margin-top:5px"></select>
  </div>
</div>
<div id="dock">
  <div id="dockMid">
    <div id="dockRun">
      <button id="btnLoop" title="run every step of the loop, in order, one after the other">▶ Run loop</button>
      <button id="btnPause">Pause</button>
      <button id="btnNext" title="run one command, then pause">Next</button>
      <button id="btnStop">Stop</button>
      <button id="btnReset" title="parts back to their loaded poses, arm to dock">Reset</button>
      <select id="speedSel" title="playback speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
      <div id="stepline">idle</div>
    </div>
    <div id="steps" title="click a step to select it, ▶ to run it alone; drag steps to reorder the loop or to move them in and out of it"></div>
  </div>
</div>
<div id="tip"></div>
<div id="status">loading…</div>
<script type="module" src="./app.js"></script>
<script type="module" src="./chat.js"></script>
</body>
</html>
